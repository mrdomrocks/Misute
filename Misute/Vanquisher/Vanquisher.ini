; Misute Vanquisher party setup.
;
; Guild Wars caps how many characters an explorable area allows, so the bot
; keeps one team per size and picks the right one when it arrives in the
; outpost. Fill in as many slots as the size allows minus yourself:
;
;   [Team4]  3 companions      [Team6]  5 companions      [Team8]  7 companions
;
; Heroes are named exactly as the game names them (Norgu, Master of Whispers,
; Zenmai, ...). Henchmen are listed by their player number, because henchman
; names cannot be read from the client - any agent inspector will show it, and
; it does not change.
;
;   Hero1=Norgu
;   Henchman1=2001
;
; Heroes are invited first, then henchmen, and anything past the area's limit
; is ignored. Blank or missing entries are skipped, so a half-filled team is
; fine. Press Reload on the Party tab after editing.

